<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><style>body{margin:0}</style><style>.snake rect{stroke-dasharray:none!important;animation:none!important}</style><style>.top h1{font-size:36px!important}</style></head><body>
<title>Injury Time Stats</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--gold:#b8860b;--bg:#f6f7f4;--panel:#ffffff;--ink:#141a17;--ink2:#5a655f;--line:#dfe4df;--accent:#1f6f4a;--accent-ink:#ffffff;--up:#1f8a55;--up-bg:#e3f2e9;--down:#b3392b;--down-bg:#fbe9e6;--flat:#8a948e;--flat-bg:#eef1ec;--gk:#c98a12;--def:#2b63b8;--mid:#1f8a55;--fwd:#c0392b;--tier:#eef1ec;--bar:#d7e6dc;--flagbg:#fff4cc;--flag:#7a5c00;--flagline:#e6c34a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gold:#ffd000;--bg:#101513;--panel:#181f1b;--ink:#eef2ee;--ink2:#9aa79f;--line:#2a332d;--accent:#3fae78;--accent-ink:#0d1410;--up:#5ccf95;--up-bg:#1b2e23;--down:#f08a7b;--down-bg:#3a1f1c;--flat:#8a948e;--flat-bg:#1e2622;--gk:#e0a52b;--def:#5c8fe0;--mid:#3fae78;--fwd:#e2645a;--tier:#1e2622;--bar:#24392d;--flagbg:#3a3115;--flag:#f0d264;--flagline:#8a7420}}
:root[data-theme="dark"]{--gold:#ffd000;--bg:#101513;--panel:#181f1b;--ink:#eef2ee;--ink2:#9aa79f;--line:#2a332d;--accent:#3fae78;--accent-ink:#0d1410;--up:#5ccf95;--up-bg:#1b2e23;--down:#f08a7b;--down-bg:#3a1f1c;--flat:#8a948e;--flat-bg:#1e2622;--gk:#e0a52b;--def:#5c8fe0;--mid:#3fae78;--fwd:#e2645a;--tier:#1e2622;--bar:#24392d;--flagbg:#3a3115;--flag:#f0d264;--flagline:#8a7420}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.4;margin:0}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;text-wrap:balance}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}   /* Evan, 13 Sep 2026: header stacked above the sentence, everything centred */
.top h1{font-size:36px;font-weight:700;line-height:1}
.top h1 small{font-family:"IBM Plex Sans";font-size:12px;font-weight:500;color:var(--ink2);margin-left:8px;letter-spacing:.04em;text-transform:uppercase}
.btn{font:inherit;font-size:12px;font-weight:500;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;margin-left:auto}.btn:hover{border-color:var(--accent)}.btn:focus-visible{outline:2px solid var(--accent)}
.seg{margin-left:auto;display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}.seg button{font:inherit;font-size:12px;font-weight:500;padding:5px 10px;border:0;background:var(--panel);color:var(--ink2);cursor:pointer}.seg button.on{background:var(--accent);color:var(--accent-ink)}.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.meta{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink2)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 16px}@media (max-width:640px){.summary{grid-template-columns:1fr 1fr}}   /* four equal tiles across the page, the two split boxes span beneath (Evan, 14 Sep 2026) */
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}

.tile .val{font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .val .mgr{display:block;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:12px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-top:2px}
.tile .sub{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2)}.tile .sub b{color:var(--ink);font-weight:700}
.fah{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;margin:22px 16px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}.fah small{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2);font-weight:400}.fatag{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin-left:8px}
.legend b{color:#fff}
.legend{padding:0 16px 8px;font-size:12px;color:var(--ink2);line-height:1.5}
.pill{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;padding:1px 6px;border-radius:999px;font-variant-numeric:tabular-nums}
.pill.up{background:var(--up-bg);color:var(--up)}.pill.down{background:var(--down-bg);color:var(--down)}.pill.flat{background:var(--flat-bg);color:var(--flat)}
.sec{margin:8px 16px 16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sec h2{font-size:20px;padding:8px 12px;border-bottom:2px solid;display:flex;justify-content:space-between;align-items:center}
.sec h2.tog{cursor:pointer;user-select:none}.sec h2 small{text-align:right;line-height:1.35}.sec h2 .hx{display:none}.sec.closed h2 .hx{display:inline}.sec.closed h2 .hc{display:none}.sec h2 .chev{display:inline-block;margin-right:8px;font-size:16px;transition:transform .15s}.sec h2 .lbl{margin-right:auto}.sec.closed h2 .chev{transform:rotate(-90deg)}.sec.closed .wrap{display:none}
.sec h2 small{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2);font-weight:400}
.sec.GKP h2{border-color:var(--gk)}.sec.FA h2{border-color:var(--ink)}.sec.DEF h2{border-color:var(--def)}.sec.MID h2{border-color:var(--mid)}.sec.FWD h2{border-color:var(--fwd)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1000px}
th,td{padding:7px 10px;text-align:center;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600;border-top:none;background:var(--tier);text-align:center}
th:first-child,td:first-child{text-align:left}
td.name{font-weight:600}td.name .rk{display:inline-block;min-width:34px;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2);font-weight:500}td.name .tm{font-size:11px;color:var(--ink2);font-weight:500;margin-left:0;letter-spacing:.04em;display:block;max-width:226px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td .v{display:inline-block;min-width:0;text-align:right}
td .p{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink2);margin-left:4px}
tr.avg td{color:var(--ink2);font-style:italic;background:var(--tier)}
tr.total td{font-weight:600;background:var(--tier);border-top:2px solid var(--ink2)}
tr.avg td{border-top:1px solid var(--line)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--tier)}
tr.detail td{background:var(--tier);padding:10px 12px;white-space:normal}td .bps{display:block;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink2);margin-top:1px}
.bars{display:grid;grid-template-columns:180px 1fr 60px;gap:4px 10px;align-items:center;font-size:12px;max-width:640px}
.bars .lab{color:var(--ink2)}.bars .bar{height:10px;background:var(--bar);border-radius:5px;overflow:hidden}.bars .bar i{display:block;height:100%;background:var(--accent)}
.bars .bar i.neg{background:var(--down)}
.bars .num{font-family:"IBM Plex Mono",monospace;text-align:right}
.tot{font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:700}
.row .tot,.row.mine .tot,tr.total .tot{color:var(--gold)}   /* player points in gold (Evan, 18 Sep 2026) */
.note{padding:0 16px 20px;color:var(--ink2);font-size:12px}
.row.out td{background:var(--down-bg)}.row.out:hover td{background:var(--down-bg)}
.row.out td.name{border-left:4px solid var(--down);padding-left:8px}
.row.flagged td{background:transparent}.row.flagged:hover td{background:var(--tier)}   /* potential transfers keep the yellow edge and flag but no shading (Evan, 16 Sep 2026) */
.row.flagged td.name{border-left:0}
.why{position:relative;display:inline-block;margin-left:6px;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.08em;padding:1px 6px;border-radius:999px;background:var(--flagline);color:#1a1400;cursor:help}
.tip{display:none}.row.flagged td.name .pn{cursor:help}
#tipbox{display:none;position:fixed;z-index:1000;width:340px;max-width:calc(100vw - 24px);white-space:normal;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:12px;font-weight:400;letter-spacing:0;line-height:1.45;color:var(--ink);background:var(--panel);border:1px solid var(--flagline);border-radius:8px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#tipbox.show{display:block}
#tipbox b{color:var(--flag)}
.flag{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--down-bg);color:var(--down);font-weight:600;margin-left:6px}td.name .flag{display:block;white-space:normal;max-width:300px;margin-top:2px}
td.last{font-family:"IBM Plex Mono",monospace;font-weight:600;cursor:help}td.last.good{color:var(--up)}td.last.poor{color:var(--down)}td.last.dnp{color:var(--flat);font-weight:500;font-size:11px}
.gb{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1}.gb i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:8px;color:var(--ink2);line-height:1;margin-bottom:1px}.gb+.gb{margin-left:3px}.row.mine .gb i{color:var(--accent-ink);opacity:.85}
.pill+.pill{margin-left:2px}
td .g{display:inline-block;min-width:0;text-align:right;margin-right:6px;vertical-align:middle}tr.avg td .g{display:none}
th[data-key]{cursor:pointer;user-select:none}.sec.FWD table,.sec.MID table,.sec.DEF table,.sec.GKP table{table-layout:fixed;width:100%;min-width:960px}th[data-key="name"],td.name{width:200px}td.name .tm,td.name .lvt,td.name .flag{max-width:186px}   /* every box fills the page: name column fixed, the rest of the width split equally among that box's columns (Evan, 14 Sep 2026: 'make everything fit nicely') */.sec.FWD th,.sec.MID th,.sec.DEF th,.sec.GKP th{white-space:normal;line-height:1.25;vertical-align:bottom}.sec.FWD td,.sec.MID td,.sec.DEF td,.sec.GKP td,.sec.FWD th,.sec.MID th,.sec.DEF th,.sec.GKP th{padding-left:6px;padding-right:6px}th[data-key]:hover{color:var(--ink)}th.sorted{color:var(--accent)}
th{text-align:center}th:first-child,th[data-key="name"],th[data-key="team"]{text-align:left}

#goal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:3000;align-items:center;justify-content:center;padding:16px;overflow:hidden}
#goal-ov.show{display:flex}
#goal{position:relative;width:min(560px,100%);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-top:10px solid #d4a017;border-radius:16px;box-shadow:0 0 0 6px rgba(212,160,23,.28),0 24px 64px rgba(0,0,0,.5);padding:26px 28px 24px;text-align:center;animation:goalpop .5s cubic-bezier(.2,1.4,.4,1)}
#goal.assist{border-top-color:#d4a017}

@keyframes goalbounce{0%,100%{transform:scale(1)}30%{transform:scale(1.18) rotate(-2deg)}60%{transform:scale(.96) rotate(1deg)}}
@keyframes goalglow{0%,100%{text-shadow:0 0 0 rgba(212,160,23,0)}50%{text-shadow:0 0 22px rgba(212,160,23,.75)}}

#goal .det{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink2);margin-top:10px;line-height:1.7}
#goal .det b{color:var(--ink);font-weight:600}
#goal .det .big{display:inline-block;font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;color:#d4a017;padding:2px 12px;border-radius:999px;background:rgba(212,160,23,.16);margin-top:6px}
#goal.assist .det .big{color:#d4a017;background:rgba(212,160,23,.16)}
#goal button{font:inherit;font-size:13px;font-weight:700;margin-top:16px;padding:9px 26px;border-radius:999px;border:0;background:#d4a017;color:#fff;cursor:pointer;letter-spacing:.04em}#goal.assist button{background:#d4a017}#goal button:hover{filter:brightness(1.1)}
.cf{position:absolute;top:0;width:10px;height:16px;border-radius:2px;pointer-events:none;animation:confetti linear forwards}
#goal.rival{border-top-color:#b3392b;box-shadow:0 0 0 6px rgba(179,57,43,.22),0 24px 64px rgba(0,0,0,.5);background:var(--tier);animation:rivalpop .4s ease-out}

#goal.rival button{background:#b3392b}
#alerts{margin:0 16px 8px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--up);border-radius:8px;padding:8px 12px;font-size:12px;display:none}

td.name{position:relative}

.ftt{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--ink2);margin-left:6px}
td.name .nm{position:relative;display:block;padding:3px 7px;margin:-3px -7px}   /* the playing box: one fixed size for every player, the name and club lines only; live line and FT sit below it (Evan, 14 Sep 2026: 'they must be same size') */
.snake{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.snake rect{fill:none;stroke:#ffd000;stroke-width:2;stroke-dasharray:50 50;stroke-linecap:round;x:1px;y:1px;width:calc(100% - 2px);height:calc(100% - 2px);filter:drop-shadow(0 0 1px rgba(0,0,0,.6));animation:crawl 4s linear infinite}

@media(prefers-reduced-motion:reduce){.snake rect{animation:none}}
th[data-key="pts"],td.pts{width:132px}.sec:not(.teams) th[data-key]:not([data-key="name"]),.sec:not(.teams) tr.row td:not(.name),.sec:not(.teams) tr.total td:not(:first-child),.sec:not(.teams) tr.avg td:not(:first-child){text-align:right;padding-right:10px}.sec:not(.teams) th .hp{display:inline-flex;justify-content:center;width:28px;vertical-align:bottom}.sec:not(.teams) th .hp>span{flex:0 0 auto;width:max-content;max-width:64px;white-space:normal;text-align:center;line-height:1.25}.sec:not(.teams) tr.row td:not(.name) .v,.sec:not(.teams) tr.total td .v,.sec:not(.teams) tr.avg td .v,.sec:not(.teams) td .tot{display:inline-block;min-width:28px;text-align:center}.sec:not(.teams) tr.row td:not(.name),.sec:not(.teams) tr.total td:not(:first-child){position:relative}.sec:not(.teams) tr.row td:not(.name) .g,.sec:not(.teams) tr.total td:not(:first-child) .g{position:absolute;right:44px;top:50%;transform:translateY(-50%);margin:0}.sec:not(.teams) tr.row td:last-child .g,.sec:not(.teams) tr.total td:last-child .g{right:52px}.sec:not(.teams) th[data-key]:last-child,.sec:not(.teams) tr.row td:last-child,.sec:not(.teams) tr.total td:last-child,.sec:not(.teams) tr.avg td:last-child{padding-right:18px}   /* every stat column: pills on the left, the number in a fixed centred slot, the header centred over that slot (Evan, 18 Sep 2026) */   /* the gold totals line up on one edge whatever the number of pills before them (Evan, 18 Sep 2026) */

#pm-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}

#pm{width:min(1320px,100%);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.35);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:13px}
