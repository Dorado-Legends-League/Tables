# Deploys the league pages on every push (Evan, 18 Oct 2026: one-minute live updates). A custom Actions workflow has no
# 10-builds-an-hour limit, unlike the branch-built site. A newer push cancels a deploy still in progress.
name: Deploy league pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub sometimes can't see the just-uploaded artifact yet ('No artifacts named github-pages'), so a failed
      # deploy retries itself twice instead of leaving the page stale until the next push (Evan, 23 Nov 2026: 'Do it now').
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 8
      - id: retry1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 15
      - id: retry2
        if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v4
