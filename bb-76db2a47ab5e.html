<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><style>body{margin:0}</style><style>.snake rect{stroke-dasharray:none!important;animation:none!important}</style><style>.top h1{font-size:36px!important}</style></head><body>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Injury Time Blackboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>/* waivers and free agents in purple: card edges, incoming (dark) and outgoing (light) shades, Team Roster pills (Evan, 17 Oct 2026: "instead of a blue color scheme for free agents, let's go purple" - "and the box shading too" - "two different shades" - "and the lines down the side of boxes") */
:root{--bg:#f6f7f4;--panel:#ffffff;--ink:#141a17;--ink2:#5a655f;--line:#dfe4df;--accent:#1f6f4a;--accent-ink:#ffffff;--glow:rgba(31,111,74,.55);--taken:#9aa39e;--mine:#e8f3ec;--mine-line:#1f6f4a;--gk:#c98a12;--def:#2b63b8;--mid:#1f8a55;--fwd:#c0392b;--warn-bg:#fbeeee;--warn:#9c2f22;--tier:#eef1ec;--shadow:0 1px 2px rgba(20,26,23,.08);--flagbg:#fff4cc;--flag:#7a5c00;--flagline:#e6c34a;--pickbg:#efe6fa;--pickline:#7b3fc4;--trbg:#ffffff;--trline:#8a8a8a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#101513;--panel:#181f1b;--ink:#eef2ee;--ink2:#9aa79f;--line:#2a332d;--accent:#3fae78;--accent-ink:#0d1410;--glow:rgba(63,174,120,.6);--taken:#5b665f;--mine:#1b2e23;--mine-line:#3fae78;--gk:#e0a52b;--def:#5c8fe0;--mid:#3fae78;--fwd:#e2645a;--warn-bg:#3a1f1c;--warn:#f0a099;--tier:#1e2622;--shadow:none;--flagbg:#3a3115;--flag:#f0d264;--flagline:#8a7420;--pickbg:#2a1d3d;--pickline:#a970e8;--trbg:#ecebe6;--trline:#ffffff}}
:root[data-theme="dark"]{--bg:#101513;--panel:#181f1b;--ink:#eef2ee;--ink2:#9aa79f;--line:#2a332d;--accent:#3fae78;--accent-ink:#0d1410;--glow:rgba(63,174,120,.6);--taken:#5b665f;--mine:#1b2e23;--mine-line:#3fae78;--gk:#e0a52b;--def:#5c8fe0;--mid:#3fae78;--fwd:#e2645a;--warn-bg:#3a1f1c;--warn:#f0a099;--tier:#1e2622;--shadow:none;--flagbg:#3a3115;--flag:#f0d264;--flagline:#8a7420;--pickbg:#2a1d3d;--pickline:#a970e8;--trbg:#ecebe6;--trline:#ffffff}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.4;margin:0}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;text-wrap:balance}
.top{position:relative;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);padding:18px 16px 10px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 20px;align-items:center}   /* Evan, 13 Sep 2026: title stacked above the controls, all centred */
.top h1{flex:0 0 100%;text-align:center;margin-bottom:6px}
.top .subt{flex:0 0 100%;text-align:center;font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;font-weight:500;color:var(--ink2);letter-spacing:.02em;margin:8px 0 4px}   /* below the position strip (Evan, 14 Oct 2026) */   /* Evan, 13 Sep 2026: "Waivers and Trades" line under the title */
.top h1{font-size:36px;font-weight:700;letter-spacing:.01em;line-height:1}
.top h1 small{font-family:"IBM Plex Sans";font-size:12px;font-weight:500;color:var(--ink2);margin-left:8px;letter-spacing:.04em;text-transform:uppercase}
.squad{display:flex;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:13px;margin-top:8px}
.squad span{border:1px solid var(--line);border-radius:4px;padding:3px 8px;display:flex;gap:6px;align-items:center}
.squad b{font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.GKP .dot,.dot.GKP{background:var(--gk)}.DEF .dot,.dot.DEF{background:var(--def)}.MID .dot,.dot.MID{background:var(--mid)}.FWD .dot,.dot.FWD{background:var(--fwd)}
.search{flex:0 1 320px;min-width:180px;max-width:320px}
.search input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-size:12px;font-weight:500;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn:focus-visible{outline:2px solid var(--accent)}
.pickinfo{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink2)}
.best{padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.best h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2);font-weight:600;margin-right:6px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--accent)}
.chip .r{font-family:"IBM Plex Mono",monospace;color:var(--ink2);font-size:12px}
.chip .pr{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--accent)}
.chip.pend{border-color:var(--pickline);background:var(--pickbg)}.chip .lab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--pickline);font-weight:700}
.chip .lab.idea{color:var(--accent)}
.chip .arrow{color:var(--ink2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin:0 2px}
.chip .out{color:var(--ink2);text-decoration:line-through}
.best .none{font-size:12px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:12px 16px}.col.FA .fapos{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;color:var(--ink2);margin-right:6px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.col h2{font-size:20px;padding:8px 12px;border-bottom:2px solid;display:flex;justify-content:space-between;align-items:baseline}
.col h2 small{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2);font-weight:400}
.col.GKP h2{border-color:var(--gk)}.col.DEF h2{border-color:var(--def)}.col.MID h2{border-color:var(--mid)}.col.FWD h2{border-color:var(--fwd)}
.tierlab{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);background:var(--tier);padding:3px 12px}
.row{display:grid;grid-template-columns:34px 1fr auto;gap:0 8px;align-items:center;padding:6px 8px 6px 12px;border-top:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--tier)}
.row .rk{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.row .nm{font-weight:600;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.row .nm .tm{font-size:11px;color:var(--ink2);font-weight:500;letter-spacing:.04em}
.row .nm .flag{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--warn-bg);color:var(--warn);font-weight:600}
.row .nm .pen{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--tier);color:var(--ink2);font-weight:600}
.row .sub{grid-column:2;font-size:11px;color:var(--ink2);font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pj{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:500;color:var(--accent);font-variant-numeric:tabular-nums;text-align:right}
.row .act{grid-column:3;display:flex;justify-content:flex-end}
.row .act button{font:inherit;font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--ink2);cursor:pointer}
.row .act button:hover{border-color:var(--accent);color:var(--ink)}
.row.taken{opacity:.55}.row.taken .nm{text-decoration:line-through}
.row.myred,.row.myred:hover{background:var(--warn-bg)!important;color:var(--ink)}   /* your own doubtful player not starting: red in the player columns, as on the Roster (Evan, 15 Oct 2026) */.row.mine{background:var(--accent);color:var(--accent-ink);border-left:0;padding-left:12px;box-shadow:0 2px 8px var(--glow);position:relative;z-index:1}
.row.mine:hover{background:var(--accent)}
.row.mine .nm,.row.mine .rk,.row.mine .sub,.row.mine .pj,.row.mine .nm .tm{color:var(--accent-ink)}
.row.mine .nm{font-size:15px}.row.mine .rk{font-weight:700}.row.mine .sub{opacity:.85}
.row.mine .nm::after{content:none;display:none;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.14em;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--accent-ink);color:var(--accent)}
.row.mine .nm .pen,.row.mine .nm .flag{background:rgba(255,255,255,.25);color:var(--accent-ink)}
.row.mine .act button{border-color:var(--accent-ink);color:var(--accent-ink)}
@keyframes pop{0%{box-shadow:0 0 0 0 var(--glow);transform:scale(1.03)}100%{box-shadow:0 0 0 18px transparent;transform:scale(1)}}
.row.mine.fresh{animation:pop 1.4s ease-out}
@media(prefers-reduced-motion:reduce){.row.mine.fresh{animation:none}}
.row.hide{display:none}
.avoid{margin:4px 16px 24px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.avoid>h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:28px;text-transform:uppercase;letter-spacing:.08em;line-height:1.1;color:var(--ink);font-weight:700;text-align:center;margin-bottom:8px}   /* same as the Available Players heading (Evan, 15 Oct 2026: 'match font to other headers') */   /* same look as the position box headers, both 24px (Evan, 14 Oct 2026: 'bigger, maybe 18' then 'make it 24') */
.avoid p{margin:0 0 8px;color:var(--ink2)}
.avoid ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:4px 16px;font-size:13px}
.avoid .agrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}@media(max-width:1100px){.avoid .agrid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.avoid .agrid{grid-template-columns:1fr}}.avoid .col h2{font-size:18px;margin:0;padding:8px 12px;border-bottom:2px solid var(--warn);display:flex;justify-content:space-between;align-items:baseline;gap:8px}.avoid .col h2 small{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2);font-weight:400;white-space:nowrap}.avoid .col.clear h2{border-color:var(--accent)}.avoid .col.dbt h2{border-color:#e6c34a}.avoid .ar .nw b.inj{color:#e6c34a;font-weight:600}   /* yellow when the only problems are injured players who may still play (Evan, 14 Oct 2026: make unavailable and injured) */   /* line colour by availability (Evan, 14 Oct 2026: teams with nobody out should have green lines): green when everyone is available, red when anyone is out - Injury Time included */.avoid .ar{padding:6px 12px;border-top:1px solid var(--line);font-size:13px}.avoid .ar:first-of-type{border-top:0}.avoid .ar .nm{font-weight:600;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.avoid .ar .nm .pn{cursor:pointer}.avoid .ar .tm{font-size:11px;color:var(--ink2);font-weight:500;letter-spacing:.04em}.avoid .ar .nw{display:block;font-size:11px;color:var(--ink2);margin-top:1px}.avoid .ar.none{color:var(--ink2);font-size:12px}
.avoid li b{font-weight:600}.avoid li span{color:var(--ink2)}
.note{padding:0 16px 16px;color:var(--ink2);font-size:12px}.note.top-note{margin:0;padding:18px 16px;border-bottom:1px solid var(--line)}   /* Evan, 16 Sep 2026: the note sits under the search row, a row of space above and below, then Potential Transfers */
.hidden-taken .row.taken{display:none}

.row.flagged,.row.mine.flagged{background:#b8bdf2!important;color:var(--ink);border-left:0;padding-left:12px;box-shadow:none}
.row.mine.flagged .nm,.row.mine.flagged .rk,.row.mine.flagged .sub,.row.mine.flagged .nm .tm{color:var(--ink)}.row.mine.flagged .pj{color:var(--accent)}.row.mine.flagged .sub{opacity:1;color:var(--ink2)}
.row.mine.flagged .nm::after{background:var(--accent);color:var(--accent-ink)}
.row.mine.flagged .act button{border-color:var(--line);color:var(--ink2)}
.row.pickup{background:var(--pickbg);border-left:0;padding-left:12px}   /* no blue or yellow stripes down the left of waiver rows anywhere on the Roster page, the shading alone marks them (Evan, 14 Oct 2026: 'remove this' / 'yellow stripes too') */
.row.out,.row.mine.out{background:var(--warn-bg);color:var(--ink);border-left:0;padding-left:12px;box-shadow:none}   /* no red bar down the left of injured rows, the shading alone marks them (Evan, 14 Oct 2026) */.row.out:not(.mine){background:transparent;border-left:0;padding-left:12px}.row.out:not(.mine):hover{background:var(--tier)}
.row.mine.out .nm,.row.mine.out .rk,.row.mine.out .sub,.row.mine.out .nm .tm{color:var(--ink)}.row.mine.out .pj{color:var(--accent)}.row.mine.out .sub{opacity:1;color:var(--ink2)}
.row.mine.out .nm::after{background:var(--accent);color:var(--accent-ink)}.row.mine.out .act button{border-color:var(--line);color:var(--ink2)}.row.out .nm .pn{cursor:help}
.why{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:700;letter-spacing:.1em;padding:2px 7px;border-radius:999px;background:var(--flagline);color:#1a1400;cursor:help;vertical-align:middle}
.why.in{background:var(--pickline);color:#fff}
.tcard .reason .tpitch,.tcard .reason .tmine{display:block}.fasec{margin:6px 16px 24px}.fawrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}.fatab{border-collapse:collapse;width:100%;min-width:720px;font-size:13px}.fatab th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600;padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);background:var(--tier)}.fatab td{padding:6px 10px;text-align:right;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}.fatab .l{text-align:left}.fatab td.n{color:var(--ink2);font-family:"IBM Plex Mono",monospace;font-size:11px}.fatab .tm{font-size:11px;color:var(--ink2);margin-left:4px}.fatab td.pj{font-weight:700;color:var(--accent)}.fatab td.fx{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2)}.fatab td.bad{color:var(--warn);font-weight:600}.fatab .ppos{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--tier)}.fatab .ppos.GKP{color:var(--gk,#e0a52b)}.fatab .ppos.DEF{color:var(--def,#5c8fe0)}.fatab .ppos.MID{color:var(--mid,#3fae78)}.fatab .ppos.FWD{color:var(--fwd,#e2645a)}:root #trades .tcard.subd .reason .tnote,:root[data-theme] #trades .tcard.subd .reason .tnote,:root:not([data-theme="light"]) #trades .tcard.subd .reason .tnote{color:#0d1410!important}#trades .tcard{display:flex;flex-direction:column}#trades .tcard .reason{flex:1;display:flex;flex-direction:column}#trades .tcard .reason .tnote{margin:auto -12px -8px -12px!important;border-radius:0 0 5px 0!important;padding:8px 12px!important}   /* note sits flush on the card's bottom edge (Evan, 15 Oct 2026) */.tcard .reason .tnote{display:block;margin:10px 0 0;padding:6px 10px;border-radius:6px;background:#d4af37!important;color:#0d1410!important;font-weight:700}#mailnag:not([hidden]){display:flex;align-items:center;justify-content:center;gap:14px}#mailnag .mn-t{flex:0 1 auto;text-align:left}#mailnag .mn-d{font-weight:700;text-decoration:underline;text-underline-offset:3px}@media(min-width:900px){#mailnag .mn-t{white-space:nowrap}}#mailnag.long .mn-t{white-space:normal!important}#mailnag.long{width:auto}   /* one row on a computer screen (Evan, 15 Oct 2026); it wraps on a phone */#mailnag .mn-ok{flex:0 0 auto;position:relative;white-space:nowrap}#mailnag{position:relative}#mailnag .snake rect{stroke:#d4af37;stroke-width:3}   /* the gold worm runs round the whole orange box */   /* button on the same row as the text, with a gold worm crawling round it (Evan, 15 Oct 2026) */#mailnag{max-width:min(1100px,calc(100% - 32px));width:fit-content;box-sizing:border-box;margin:10px auto 0;padding:10px 14px;border:1px solid var(--trline);border-left:6px solid var(--trline);border-radius:8px;background:var(--trbg);color:var(--ink);font-size:15px;text-align:center}#mailnag .mn-ok{margin-left:0;font:inherit;font-weight:700;padding:4px 14px;border-radius:6px;border:0;background:var(--ink);color:#0d1410;cursor:pointer}#itpop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9999;padding:16px}#itpop.show{display:flex}#itpop.tall{position:absolute;top:0;left:0;right:0;bottom:auto;align-items:flex-start}#itpop.tall .itpop-b{position:absolute;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 32px))}#itpop .itpop-b{background:var(--card,#181f1b);color:var(--ink);border:1px solid var(--trline);border-left:6px solid var(--warn);border-radius:8px;max-width:440px;padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:15px;line-height:1.45}#itpop p{margin:0 0 14px}#itpop button{font:inherit;font-weight:600;padding:6px 18px;border-radius:6px;border:1px solid var(--line);background:var(--accent);color:var(--accent-ink);cursor:pointer}#itpop .itpop-b{background:#d4af37;color:#0d1410;border:1px solid #b8962e;border-left:6px solid #0d1410}#itpop button{background:#0d1410;color:#d4af37;border:3px solid #fff;outline:none}#itpop button:focus,#itpop button:focus-visible{outline:none;box-shadow:none}   /* thick white outline on the black OK button, no blue focus ring (Evan, 15 Oct 2026) */   /* gold box, black lettering (Evan, 15 Oct 2026) */#best .tcard .wshort{display:none}#submitted .tcard .wfull{display:block}#submitted .tcard:not(.subd) .wfull{display:block}   /* lodged claims: short note while selected, the full case once unselected (Evan, 15 Oct 2026) */.tcard .tli{margin:4px 0 0;padding-left:18px}.tcard .tli li{margin:2px 0}.tcard .keptnote{font-size:12px;color:var(--flagline);margin:0 0 6px}.tcard .tverdict{display:block;margin:2px 0 6px;font-weight:600}.tcard .tverdict.good{color:var(--accent)}.tcard .tverdict.bad{color:var(--warn)}:root .tcard .tverdict.bad,:root[data-theme] .tcard .tverdict.bad,:root #trades .tcard.subd .tverdict.bad{color:#fff!important;background:#d0101b;padding:4px 8px;border-radius:4px;font-weight:700}   /* warning verdicts in red (Evan, 15 Oct 2026) */.tcard .reason .tmine{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:.9em;color:var(--ink2)}.tcard .reason .tsec{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-bottom:3px}   /* trade pitch is written to the other manager; Evan's own side sits underneath, quieter (Evan, 15 Oct 2026) */
.tip{display:none}.row.flagged .nm .pn,.row.pickup .nm .pn{cursor:help}

.pn{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:var(--ink2)}.pn:hover{color:var(--accent);text-decoration-color:var(--accent)}
.row.mine .pn:hover{color:var(--accent-ink)}
#pm-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:2000;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto}
#pm-ov.show{display:flex}
#pm{width:min(1320px,100%);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.35);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:13px}
#pm .hd{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line);border-top:6px solid var(--accent);border-radius:10px 10px 0 0;position:relative}
#pm .hd.GKP{border-top-color:var(--gk)}#pm .hd.DEF{border-top-color:var(--def)}#pm .hd.MID{border-top-color:var(--mid)}#pm .hd.FWD{border-top-color:var(--fwd)}
#pm .hd .pos{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--tier);color:var(--ink2)}
#pm .hd h3{font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:700;margin:4px 0 0;line-height:1}
#pm .hd .club{color:var(--ink2);font-size:13px;margin-top:2px}
#pm .hd .own{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink2);margin-top:2px}   /* ownership line: Under contract (manager) / Free agent (Evan, 15 Sep 2026) */
#pm .hd .news{margin-top:4px;font-size:12px;padding:2px 6px;border-radius:3px;background:var(--down-bg,#fbe9e6);color:var(--down,#b3392b);display:inline-block}
#pm .x{position:absolute;top:12px;right:12px;font:inherit;font-size:18px;line-height:1;width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}#pm .x:hover{border-color:var(--accent)}
#pm .strip{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
#pm .strip div{padding:10px 12px;text-align:center;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end}   /* values share one baseline even when a label wraps (Evan, 14 Sep 2026: 'numbers on same row') */#pm .strip div:last-child{border-right:0}
#pm .strip .l{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
#pm .strip .v{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700;line-height:1.1}#pm .strip .v.up{color:var(--up)}#pm .strip .v.down{color:var(--down)}#pm .strip .v.flat{color:var(--flat)}   /* the pills' green / red / grey on the four strip numbers (Evan, 15 Sep 2026) */
#pm .ict{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);background:var(--tier)}
#pm .ict div{padding:8px 12px;text-align:center}#pm .ict .l{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600}
#pm .ict .v{font-family:"IBM Plex Mono",monospace;font-size:13px}#pm .ict .v b{font-weight:600}
#pm .ict div:last-child{border-left:2px solid var(--line)}
#pm .tabs{display:flex;gap:6px;padding:10px 18px 0}
#pm .tabs button{font:inherit;font-size:12px;font-weight:600;padding:6px 14px;border-radius:6px 6px 0 0;border:1px solid var(--line);border-bottom:0;background:var(--tier);color:var(--ink2);cursor:pointer}
#pm .tabs button.on{background:var(--panel);color:var(--ink)}
#pm .body{padding:0 18px 16px;border-top:1px solid var(--line)}
#pm .scroll{overflow-x:auto;margin-top:10px}
#pm table{border-collapse:collapse;width:100%;min-width:1240px;font-size:12px;table-layout:fixed}   /* equidistant stat columns on player and team cards (Evan, 14 Sep 2026) */
#pm th.l:first-child{width:76px}#pm th.l:nth-child(2){width:150px}#pm td.l{overflow:hidden;text-overflow:ellipsis}
#pm th,#pm td{padding:6px 8px;text-align:center;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}   /* every stat centred in its own equal column (Evan, 14 Sep 2026: 'equidistant and in real columns') */
#pm th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);font-weight:600;border-top:0}

window.sizeRoster=function(){document.querySelectorAll('#roster .col').forEach(box=>{const rows=[...box.querySelectorAll('.rr,.rh')];if(!rows.length)return;
  if(box.getBoundingClientRect().width<360){rows.forEach(r=>r.style.gridTemplateColumns='');return}
  const n=Math.max(...rows.map(r=>r.children.length));const w=new Array(n).fill(0);
  rows.forEach(r=>[...r.children].forEach((c,i)=>{if(i===0)return;const sp=document.createElement('span');sp.style.cssText='position:absolute;visibility:hidden;white-space:nowrap';sp.className=c.className;sp.innerHTML=c.innerHTML;c.parentNode.appendChild(sp);const cw=Math.ceil(sp.getBoundingClientRect().width)+2;sp.remove();if(cw>w[i])w[i]=cw}));
  const tpl='minmax(0,1fr) '+w.slice(1).map(x=>Math.max(x,14)+'px').join(' ')+' 22px';   /* last track = the XI tag (the row's ::after) */rows.forEach(r=>r.style.gridTemplateColumns=tpl)})};
addEventListener('resize',()=>{clearTimeout(window.__srT);window.__srT=setTimeout(sizeRoster,120)});setTimeout(sizeRoster,50);</script>
<script>/* ON THE FIELD (Evan, 17 Oct 2026): a starter in the Best Eleven whose game kicked off within the last 115 minutes is ringed in gold on the Roster; checked every minute (the page reloads every 5) */(function(){const KO={};(DATA.roster||[]).forEach(r=>{if(r.ko)KO[r.id]=Date.parse(r.ko)});function mark(){const now=Date.now();const LB={};((DATA.lineup&&DATA.lineup.best)||[]).forEach(x=>LB[x.id]=x);const LA={};(((DATA.lineup&&DATA.lineup.best)||[]).concat((DATA.lineup&&DATA.lineup.bench)||[])).forEach(x=>LA[x.id]=x);document.querySelectorAll('#roster .rr').forEach(r=>{const p=r.querySelector('.pn');if(!p)return;const id=+p.dataset.pid,k=KO[id],x=LB[id];const live=x&&('min' in x)?(x.min>0&&!x.done):true;r.classList.toggle('onfield',!!k&&!!x&&live&&now>=k&&now<=k+115*60000);
  /* LIVE STATUS (Evan, 17 Oct 2026: 'show who is soon to play, who is DNP, who is starting XI'): during a locked gameweek the Status cell reads
     the kickoff time before his game, 'On \u00b7 pts' while he is on the pitch, 'Done \u00b7 pts' after, and DNP once his game has started without him */
  const st=r.querySelector('.st'),y=LA[id];if(!st||!y||!(DATA.lineup&&DATA.lineup.locked))return;if(st.dataset.orig==null)st.dataset.orig=st.textContent;
  let t,c;if(!k&&!y.done){t='No game';c='stdnp'}else if(y.min>0&&!y.done&&!y.subbedoff){t='On \u00b7 '+y.pts;c='stlive'}else if(y.min>0){t='Done \u00b7 '+y.pts;c='stdone'}else if(y.done){t='DNP';c='stdnp'}else if(k&&now>=k){if(LB[id]&&now<k+9e5){t='On \u00b7 0';c='stlive'}else{t='DNP';c='stdnp'}}else{const d=new Date(k);t=d.toLocaleDateString([], {weekday:'short'})+' '+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}).replace(/\s?([AP])M/i,(m,a)=>a.toLowerCase()+'m');c='stsoon'}
  if(y.nochance&&c==='stsoon')c='stdnp';st.textContent=t;st.classList.remove('stlive','stdone','stdnp','stsoon','stnoton');st.classList.add(c);st.classList.toggle('stfade',!!y.nochance);st.title=st.dataset.orig;r.classList.toggle('rowyet',(c==='stsoon'||c==='stlive')&&!!LB[id]);   /* starters only */   /* in a game = shaded, out = not (Evan, 17 Oct 2026) */   /* only your starting eleven is shaded before kickoff - the bench never (Evan, 17 Oct 2026: Kelleher yes, Roefs only if he starts) */   /* still to play this week: the row turns gold (Evan, 17 Oct 2026) */r.classList.remove('outwk')})   /* no lines in the Roster boxes - only in the Best Eleven (Evan, 17 Oct 2026) */   /* out for the week (DNP or no game): diagonal white lines over the row (Evan, 17 Oct 2026) */   /* the ring comes off a starter who has not got on the pitch (DNP) - only real minutes count (Evan, 17 Oct 2026) */}mark();if(window.sizeRoster)sizeRoster();setInterval(()=>{mark();if(window.sizeRoster)sizeRoster()},60000)})();</script>
<script>/* the Blackboard keeps its scroll position through its 5-minute reloads and republishes (Evan, 16 Oct 2026: pages set up for the games, scroll and zoom) */(function(){var K='it_board_scroll';function sv(){try{sessionStorage.setItem(K,String(window.scrollY||0))}catch(e){}try{localStorage.setItem(K+'_keep',String(window.scrollY||0))}catch(e){}try{var m=window.name&&window.name.indexOf('ITBS:')===0?{}:null;if(!window.name||m)window.name='ITBS:'+(window.scrollY||0)}catch(e){}}function rd(){var v=null;try{v=sessionStorage.getItem(K)}catch(e){}if(v==null){try{v=localStorage.getItem(K+'_keep')}catch(e){}}if(v==null){try{if(window.name&&window.name.indexOf('ITBS:')===0)v=window.name.slice(5)}catch(e){}}return v==null?null:+v}var y=rd();if(y){var u=false;['wheel','touchstart','keydown','mousedown'].forEach(function(ev){addEventListener(ev,function(){u=true},{passive:true,once:true})});var n=0;(function go(){if(u)return;window.scrollTo(0,y);if(n++<30)setTimeout(go,100)})()}   /* keeps re-applying for 3 seconds while late content (banner, marks) settles, unless the viewer starts scrolling */var t;addEventListener('scroll',function(){clearTimeout(t);t=setTimeout(sv,150)},{passive:true});addEventListener('beforeunload',sv)})();</script>

<script>

function pmRender(){const p=PM[pmId];if(!p)return;const f1=x=>(Math.round(x*10)/10).toFixed(1);
 // the card follows the page's period (Evan, 14 Sep 2026): "Since the league began" shows only gameweeks from DATA.start_gw, that period's total and his rank at his position from the table; "Whole season" shows everything and his overall rank
 const ALL=(typeof MODE!=='undefined'&&MODE==='all')||!DATA.start_gw;const rows=ALL?p.hist:p.hist.filter(r=>r.gw>=DATA.start_gw);const tp=(DATA.players||[]).find(x=>x.id===pmId);const rk=ALL?['Overall rank',ORDN(p.rank)]:(tp&&tp.rank?['Rank at position',ORDN(tp.rank)]:['Overall rank',ORDN(p.rank)]);const total=ALL?p.total:rows.reduce((a,r)=>a+r.pts,0);const played=rows.filter(r=>r.mp>0);const form=played.length?(played.reduce((a,r)=>a+r.pts,0)/played.length).toFixed(1):'&ndash;';   // form = points per game played over the period shown, not FPL's 30-day figure (Evan, 14 Sep 2026)

 const TIP={pts:'Points',mp:'Minutes played',gs:'Goals scored',a:'Assists',cs:'Clean sheets',gc:'Goals conceded',og:'Own goals',ps:'Penalties saved',pm:'Penalties missed',yc:'Yellow cards',rc:'Red cards',s:'Saves',b:'Bonus',dc:'Defensive contribution actions',i:'Influence',c:'Creativity',t:'Threat',ict:'ICT index',xg:'Expected goals',xa:'Expected assists'};
 let body='';
 if(pmTab==='hist'){if(!rows.length)body='<p class="empty">'+(ALL?'No matches played yet this season.':'No matches since the league began.')+'</p>';else{
  const tot={};H.forEach(k=>tot[k]=0);rows.forEach(r=>H.forEach(k=>{if(typeof r[k]==='number')tot[k]+=r[k]}));
  body='<div class="scroll"><table><thead><tr>'+H.map(k=>'<th class="'+(k==='gw'||k==='opp'?'l':'')+'" title="'+(TIP[k]||'')+'">'+LAB[k]+'</th>').join('')+'</tr></thead><tbody>'+
   rows.map(r=>'<tr>'+H.map(k=>{let v=r[k];if(k==='opp')v=r.opp+' ('+(r.home?'H':'A')+')'+pmScore(r);else if(['i','c','t','ict'].includes(k))v=f1(v);else if(k==='xg'||k==='xa')v=v.toFixed(2);return '<td class="'+(k==='gw'||k==='opp'?'l':'')+(k==='pts'?' pts':'')+'">'+v+'</td>'}).join('')+'</tr>').join('')+
   '<tr class="tot"><td class="l">Totals</td><td class="l"></td>'+H.slice(2).map(k=>'<td>'+(['i','c','t','ict'].includes(k)?f1(tot[k]):(k==='xg'||k==='xa')?tot[k].toFixed(2):tot[k])+'</td>').join('')+'</tr></tbody></table></div>'}}
 else if(pmTab==='past'){const PH=H.filter(k=>k!=='gw'&&k!=='opp');if(!(p.past&&p.past.length))body='<p class="empty">No Premier League seasons on record.</p>';else{body='<div class="scroll"><table><thead><tr><th class="l">Season</th>'+PH.map(k=>'<th title="'+(TIP[k]||'')+'">'+LAB[k]+'</th>').join('')+'</tr></thead><tbody>'+p.past.map(r=>'<tr><td class="l">'+r.season+'</td>'+PH.map(k=>{let v=r[k];if(['i','c','t','ict'].includes(k))v=f1(v);else if(k==='xg'||k==='xa')v=Number(v).toFixed(2);return '<td class="'+(k==='pts'?'pts':'')+'">'+v+'</td>'}).join('')+'</tr>').join('')+'</tbody></table></div>'}}
 else{body=p.fix.length?'<div class="scroll"><table class="fix"><thead><tr><th class="l">GW</th><th class="l">Date</th><th class="l">Opponent</th><th>Difficulty</th></tr></thead><tbody>'+p.fix.map(x=>'<tr><td class="l">'+x.gw+'</td><td class="l">'+x.date+'</td><td class="l">'+x.opp+' ('+(x.home?'H':'A')+')</td><td><span class="diff d'+x.diff+'">'+x.diff+'</span></td></tr>').join('')+'</tbody></table></div>':'<p class="empty">No fixtures listed.</p>'}
 const AV=(((ALL||!DATA.avg)&&DATA.avg_all)?DATA.avg_all:(DATA.avg||{}))[p.p]||null;const avPG=(AV&&AV.gp)?AV.total/AV.gp:null;const cmp=(v,a)=>(v==null||a==null||isNaN(v))?'flat':v>a+0.5?'up':v<a-0.5?'down':'flat';const rkN=ALL?p.n_all:((tp&&tp.rank_of)||p.n_all);const rkV=ALL?p.rank:((tp&&tp.rank)||p.rank);const rkC=(!rkV||!rkN)?'flat':rkV<=Math.ceil(rkN/3)?'up':rkV>rkN-Math.ceil(rkN/3)?'down':'flat';const formC=played.length?cmp(parseFloat(form),avPG):'flat';const evC=p.ev==null?'flat':cmp(p.ev,avPG);const totC=cmp(total,AV?AV.total:null);   // strip numbers in the pills' green/red/grey: rank by thirds of the pool, form and GW points v the position's points per game, total v the position's average total (Evan, 15 Sep 2026)
 pmEl.innerHTML='<div class="hd '+p.p+'"><div><span class="pos">'+p.pn+'</span><h3>'+p.full+'</h3><div class="club">'+p.t+'</div><div class="own">'+((tp&&tp.owner)||(DATA.owners||{})[pmId]?'Under contract ('+((tp&&tp.owner)||DATA.owners[pmId])+')':(p.st==='u'?'Left the Premier League':'Free agent'))+'</div>'+(p.news?'<div class="news">'+p.news+'</div>':'')+'</div><button class="x" aria-label="Close">\u00d7</button></div>'+
  '<div class="strip"><div><div class="l">'+rk[0]+'</div><div class="v '+rkC+'">'+rk[1]+'</div></div><div><div class="l">Form</div><div class="v '+formC+'">'+form+'</div></div><div><div class="l">GW '+(DATA.gw||DATA.season_gw||'')+'</div><div class="v '+evC+'">'+(p.ev==null?'\u2013':p.ev+'pts')+'</div></div><div><div class="l">Total</div><div class="v '+totC+'">'+total+'pts</div></div></div>'+
  '<div class="ict"><div><div class="l">Influence</div><div class="v"><b>'+p.ict.inf+'</b> of '+p.n_type+'</div></div><div><div class="l">Creativity</div><div class="v"><b>'+p.ict.cre+'</b> of '+p.n_type+'</div></div><div><div class="l">Threat</div><div class="v"><b>'+p.ict.thr+'</b> of '+p.n_type+'</div></div><div><div class="l">ICT index</div><div class="v"><b>'+p.ict.idx+'</b> of '+p.n_type+'</div></div><div><div class="l">Overall ICT rank</div><div class="v"><b>'+p.ict.all+'</b> of '+p.n_all+'</div></div></div>'+
  '<div class="tabs"><button data-t="hist" class="'+(pmTab==='hist'?'on':'')+'">This season</button><button data-t="past" class="'+(pmTab==='past'?'on':'')+'">Past seasons</button></div><div class="body">'+body+'</div>'}
// ---- team card (click a team row on the League Table or the Stats Teams table) ----
let tmTab='gws',tmKey=null;
function tmRows(){const M=(typeof MODE!=='undefined'&&MODE==='all')?'all':'counted';return ((DATA.table||{})[M])||[]}
function ORDN(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function tmRender(){const T=tmRows();const r=T.find(x=>x.manager===tmKey);if(!r)return;const FULL=(DATA.manager_full||{})[r.manager]||r.manager;const lead=T.length?Math.max(...T.map(x=>x.total||0)):0;
 const avgOf=gw=>{const rs=T.map(x=>((x.gws||[]).find(y=>y.gw===gw)||{}).pts).filter(v=>v!=null);return rs.length?rs.reduce((a,b)=>a+b,0)/rs.length:null};
 const pill=(v,av)=>{const cls=av==null?'flat':v>av+0.5?'up':v<av-0.5?'down':'flat';return '<span class="tpill '+cls+'" title="League average that gameweek: '+(av==null?'n/a':av.toFixed(1))+'">'+v+'</span>'};
 let body='';
 if(tmTab==='gws'){const gws=r.gws||[];if(!gws.length)body='<p class="empty">No gameweeks scored yet.</p>';else{
  const rankOf=(gw,pts)=>{const rs=T.map(x=>((x.gws||[]).find(y=>y.gw===gw)||{}).pts).filter(v=>v!=null);return ORDN(rs.filter(v=>v>pts).length+1)};
  body='<div class="scroll"><table class="gwt" style="min-width:620px"><thead><tr><th class="l">GW</th><th class="c">GW rank</th><th>Pts</th><th>Goals</th><th>Assists</th><th>CS</th><th>Bonus</th><th>Cards</th><th>Bench</th></tr></thead><tbody>'+
   gws.map(g=>'<tr><td class="l">'+g.gw+'</td><td class="c">'+rankOf(g.gw,g.pts)+'</td><td class="pts">'+pill(g.pts,avgOf(g.gw))+'</td><td>'+g.g+'</td><td>'+g.a+'</td><td>'+g.cs+'</td><td>'+g.bonus+'</td><td>'+g.cards+'</td><td>'+g.bench+'</td></tr>').join('')+
   '<tr class="tot"><td class="l">Totals</td><td class="c">'+(r.rank?ORDN(r.rank):'')+'</td><td>'+r.total+'</td><td>'+r.g+'</td><td>'+r.a+'</td><td>'+r.cs+'</td><td>'+r.bonus+'</td><td>'+r.cards+'</td><td>'+r.bench+'</td></tr></tbody></table></div>'}}
 else{const ORD={GKP:0,DEF:1,MID:2,FWD:3};const ps=(DATA.players||[]).filter(p=>p.owner===r.manager).sort((a,b)=>(ORD[a.p]-ORD[b.p])||(b.total-a.total));

  const SM=(typeof MODE!=='undefined'&&MODE==='all');const SV=p=>(SM&&p.all)?p.all:p;const SC=(p,k)=>{const c=(SV(p).cats||[]).find(c=>c.k===k);return c?c.val:0};const SRK=p=>(SM&&p.all&&p.all.rank)?p.all.rank:p.rank;
  const SFORM=p=>{const g=(p.recent||[]).filter(x=>!x.upcoming).slice(-3);return g.length?(g.reduce((a,x)=>a+(x.pts||0),0)/g.length).toFixed(1):'&ndash;'};

   ps.map(p=>{const v=SV(p);const nx=(PM[p.id]||{}).fix&&PM[p.id].fix[0];return '<tr><td class="l">'+p.p+'</td><td class="l"><span class="pn" data-pid="'+p.id+'">'+p.n+'</span></td><td class="l">'+p.t+'</td><td>'+(v.gp||0)+'</td><td class="pts">'+(v.total||0)+'</td>'+SCOLS.map(c=>'<td>'+SC(p,c[0])+'</td>').join('')+'<td>'+SFORM(p)+'</td><td>'+(SRK(p)?'#'+SRK(p):'&ndash;')+'</td><td class="l"><span class="nxb">'+(nx?nx.opp+' ('+(nx.home?'H':'A')+') <span class="diff d'+nx.diff+'">'+nx.diff+'</span>':'&ndash;')+'</span></td><td class="l st-'+(p.st||'a')+'" title="'+((p.chance!=null?p.chance+'% chance of playing. ':'')+(p.news||'')).replace(/"/g,'&quot;')+'">'+(stl[p.st||'a']||'Fit')+'</td></tr>'}).join('')+
   '</tbody></table></div>':'<p class="empty">No squad data.</p>'}
 const last=(r.gws||[]).slice(-1)[0];
 const TR=tmRows();const nT=TR.length||1;const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;const avT=mean(TR.map(x=>x.total||0));const avG=mean(TR.map(x=>{const l=(x.gws||[]).slice(-1)[0];return l?l.pts:0}));const avB=mean(TR.map(x=>lead-(x.total||0)));const cmp=(v,a)=>(v==null||a==null)?'flat':v>a+0.5?'up':v<a-0.5?'down':'flat';const rkC=!r.rank?'flat':r.rank<=Math.ceil(nT/3)?'up':r.rank>nT-Math.ceil(nT/3)?'down':'flat';const behind=lead-(r.total||0);const bC=behind===0?'up':cmp(avB,behind);   // team strip in green/red/grey: rank by thirds of the league, points and last GW v the league average, behind v the average gap (Evan, 15 Sep 2026)
 pmEl.innerHTML='<div class="hd TEAM"><div><h3>'+r.team+'</h3><div class="club">'+FULL+'</div></div><button class="x" aria-label="Close">\u00d7</button></div>'+

function openTeam(m){if(!tmRows().find(x=>x.manager===m))return;tmKey=m;tmTab='gws';tmRender();pmOv.classList.add('show');pmEl.querySelector('.x').focus()}
